name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked --no-fail-fast 2>&1 | tee test.log
      - name: Report failures
        if: failure()
        run: |
          # Raw job logs need admin rights; annotations do not, so the failure
          # is republished as ::error:: where it can actually be read.
          grep -E "^---- |^thread '|^assertion|^test result: FAILED|^  left|^ right|^    [a-z_]+::" test.log \
            | head -40 > failures.txt || true
          while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error title=test::$line"
          done < failures.txt
      - name: MCP handshake
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./target/debug/rekit mcp | tee out.jsonl
          grep -q '"name":"rekit"' out.jsonl
          grep -q '"name":"antidebug"' out.jsonl

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
